version: '3.8'

services:
  nat-kitchen-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nat_kitchen_88
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
